name: Fork build

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Check Hitman 3 MD5']
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if a release for this combination already exists'
        type: boolean
        default: false

concurrency:
  group: fork-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.k.outputs.build }}
      tag: ${{ steps.k.outputs.tag }}
      base_tag: ${{ steps.k.outputs.base_tag }}
      zhm_tag: ${{ steps.k.outputs.zhm_tag }}
      hh_tag: ${{ steps.k.outputs.hh_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
          fetch-depth: 0
      - id: k
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          BASE_TAG=$(git -C fork describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
          # Changes only when build-relevant source changes (not docs / workflows / UPDATING.md).
          SRC_KEY=$(git -C fork ls-tree HEAD -- src rust "Mod Manager" "For Build" Third-Party piscina docs package.json package-lock.json tsconfig.json fork-tools/build.ps1 fork-tools/update-game-hash.sh | sha256sum | cut -c1-7)
          ZHM_TAG=$(gh api repos/OrfeasZ/ZHMTools/releases/latest --jq .tag_name)
          HH_TAG=$(gh api repos/glacier-modding/hitman-hashes/releases/latest --jq .tag_name)
          MD5_KEY=$({ cat fork/hitman-hash.txt fork/hitman-packagedefinition.txt 2>/dev/null || true; } | sha256sum | cut -c1-7)
          KEY="${BASE_TAG}-${SRC_KEY}-zhm${ZHM_TAG}-hh${HH_TAG}-m${MD5_KEY}"
          TAG="auto-$(printf '%s' "$KEY" | tr -c 'A-Za-z0-9._-' '-')"

          BUILD=true
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "${FORCE:-}" != "true" ]; then
            BUILD=false
          fi
          echo "tag=$TAG  build=$BUILD"
          {
            echo "build=$BUILD"
            echo "tag=$TAG"
            echo "base_tag=$BASE_TAG"
            echo "zhm_tag=$ZHM_TAG"
            echo "hh_tag=$HH_TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Toolchain
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          corepack enable
          yarn --cwd fork/rust --version
          npm install -g typescript@5.6 pkg
          rustc -V
          tsc -v
      - name: Add Steam MD5
        run: |
          set -euo pipefail
          (grep -oE '^[0-9a-f]{32}' fork/hitman-hash.txt 2>/dev/null || true) | while read -r h; do
            MD5="$h" SMF_ROOT="$PWD/fork" bash fork/fork-tools/update-game-hash.sh
          done
      - name: Overlay ZHMTools ResourceLib and ResourceTool
        run: |
          set -euo pipefail
          T="${{ needs.check.outputs.zhm_tag }}"
          B="https://github.com/OrfeasZ/ZHMTools/releases/download/$T"
          curl -fsSL -o rl.zip "$B/ResourceLib-win-x64.zip"
          curl -fsSL -o rt.zip "$B/ResourceTool-win-x64.zip"
          7z x rl.zip -orl -y > /dev/null
          7z x rt.zip -ort -y > /dev/null
          for f in ResourceLib_HM2 ResourceLib_HM2016 ResourceLib_HM3 ResourceLib_KNT; do
            [ -f "rl/$f.dll" ] || { echo "missing $f.dll in $T"; exit 1; }
            cp -f "rl/$f.dll" "fork/For Build/Third-Party/$f.dll"
          done
          [ -f rt/ResourceTool.exe ] || { echo "missing ResourceTool.exe in $T"; exit 1; }
          cp -f rt/ResourceTool.exe "fork/For Build/Third-Party/ResourceTool.exe"
      - name: Overlay clean package definition (from the Steam depot)
        run: |
          set -euo pipefail
          if [ -s fork/hitman-packagedefinition.txt ]; then
            cp -f fork/hitman-packagedefinition.txt "fork/For Build/cleanPackageDefinition.txt"
            cp -f fork/hitman-packagedefinition.txt "fork/cleanPackageDefinition.txt"
            echo "SMF_KEEP_CLEAN_PACKAGEDEF=1" >> "$GITHUB_ENV"
          else
            echo "No depot package definition committed; the build will drop the shipped copy."
          fi
      - name: Build
        shell: pwsh
        run: |
          & ./fork/fork-tools/build.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          BASE_TAG: ${{ needs.check.outputs.base_tag }}
          ZHM_TAG: ${{ needs.check.outputs.zhm_tag }}
          HH_TAG: ${{ needs.check.outputs.hh_tag }}
        run: |
          set -euo pipefail
          cp fork/Release.zip "SMF-$TAG.zip"
          {
            echo "Automated build of this repository's own source (last synced from [atampy25/simple-mod-framework](https://github.com/atampy25/simple-mod-framework) $BASE_TAG; nothing is fetched from that repo at build time). **Not deploy-tested** (CI has no game)."
            echo
            echo "- Steam HITMAN3.exe MD5 read from the Steam depot by the 'Check Hitman 3 MD5' workflow (hitman-hash.txt) and added to the game hash table. Steam only; the other platforms' hashes are as of the last sync."
            echo "- ResourceLib DLLs and ResourceTool.exe from [OrfeasZ/ZHMTools $ZHM_TAG](https://github.com/OrfeasZ/ZHMTools/releases/tag/$ZHM_TAG)."
            echo "- Hash list from glacier-modding/hitman-hashes release $HH_TAG."
            if [ -s fork/hitman-packagedefinition.txt ]; then
              echo "- cleanPackageDefinition.txt is the vanilla copy read from the Steam depot (same game version as the MD5 above)."
            else
              echo "- cleanPackageDefinition.txt is omitted and regenerates on first deploy. Verify game files in Steam first."
            fi
            echo
            echo "When upgrading, do not overwrite config.json or Mods. Update guide: fork-tools/UPDATING.md"
          } > notes.md
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" "SMF-$TAG.zip" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SMF $BASE_TAG fork (auto, $TAG)" --notes-file notes.md
          # keep only the 5 newest auto releases
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("auto-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r t; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y; done
