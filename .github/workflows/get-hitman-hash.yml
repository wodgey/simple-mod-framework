name: Check Hitman 3 Executable MD5 & Build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET Runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download DepotDownloader from GitHub Releases
        run: |
          mkdir -p depotdownloader_cli
          curl -sL https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-linux-x64.zip -o depotdownloader.zip
          unzip -o depotdownloader.zip -d depotdownloader_cli
          chmod +x depotdownloader_cli/DepotDownloader

      - name: Download HITMAN3.exe via Demo Depot
        run: |
          ./depotdownloader_cli/DepotDownloader \
            -app 1847520 \
            -depot 1659041 \
            -filelist <(echo "Retail/HITMAN3.exe") \
            -dir ./game_files \
            -username "${{ secrets.STEAM_USER }}" \
            -password "${{ secrets.STEAM_PASSWORD }}"

      - name: Calculate and Export MD5 Hash
        id: compute-hash
        run: |
          EXE_PATH=$(find ./game_files -name "HITMAN3.exe" -print -quit)
          
          if [ -z "$EXE_PATH" ]; then
            echo "Error: HITMAN3.exe could not be found!"
            exit 1
          fi

          NEW_HASH=$(md5sum "$EXE_PATH" | awk '{print $1}')
          echo "CURRENT_HITMAN_MD5=$NEW_HASH"
          echo "md5=$NEW_HASH" >> $GITHUB_OUTPUT

          if [ -f "hitman-hash.txt" ]; then
            OLD_HASH=$(cat hitman-hash.txt)
          else
            OLD_HASH=""
          fi
          
          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "hash_changed=true" >> $GITHUB_OUTPUT
            echo "$NEW_HASH" > hitman-hash.txt
            echo "MD5 hash changed! Proceeding with build."
          else
            echo "hash_changed=false" >> $GITHUB_OUTPUT
            echo "MD5 hash matches existing record. Skipping build."
          fi

      - name: Run Build Script with MD5 Safety-Check
        if: steps.compute-hash.outputs.hash_changed == 'true'
        env:
          HM3_HASH: ${{ steps.compute-hash.outputs.md5 }}
        run: |
          echo "Compiling with validated Hitman 3 MD5: $HM3_HASH"
          # Put your actual build script execution here, e.g.:
          # ./your-build-script.sh "$HM3_HASH"

      - name: Commit Updated Hash File
        if: steps.compute-hash.outputs.hash_changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hitman-hash.txt
          git commit -m "Hitman 3 updated! New MD5: ${{ steps.compute-hash.outputs.md5 }}"
          git push
