name: Check Hitman 3 Executable MD5

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  fetch-hash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download and Extract DepotDownloader
        run: |
          mkdir -p depotdownloader_cli
          curl -sL https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip -o depotdownloader.zip
          unzip -o depotdownloader.zip -d depotdownloader_cli
          chmod +x depotdownloader_cli/DepotDownloader
          ls -la depotdownloader_cli/
          # Verification: Confirm the DepotDownloader executable file exists and has execution permissions.

      - name: Download HITMAN3.exe via Demo Depot
        run: |
          ./depotdownloader_cli/DepotDownloader \
            -app 1847520 \
            -depot 1659041 \
            -file "Retail/HITMAN3.exe" \
            -dir ./game_files \
            -username "${{ secrets.STEAM_USER }}" \
            -password "${{ secrets.STEAM_PASSWORD }}"
          # Verification: Check that DepotDownloader successfully logs into Steam and retrieves the file.

      - name: Calculate and Print MD5
        run: |
          EXE_PATH=$(find ./game_files -name "HITMAN3.exe" -print -quit)
          
          if [ -z "$EXE_PATH" ]; then
            echo "Error: HITMAN3.exe could not be found!"
            exit 1
          fi

          MD5_HASH=$(md5sum "$EXE_PATH" | awk '{print $1}')
          echo "CURRENT_HITMAN_MD5=$MD5_HASH"
          echo "The current MD5 hash of HITMAN3.exe is: $MD5_HASH"
          # Verification: The unique MD5 checksum string prints cleanly in the job logs.
